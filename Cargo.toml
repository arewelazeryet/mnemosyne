[package]
name = "mnemosyne"
version = "0.1.0"
edition = "2024"

[dependencies]
bigdecimal = { version = "0.4.10", features = ["serde"] }
color-eyre = "0.6.5"
chrono = { version = "0.4", features = ["serde"] }
futures = "0.3.32"
metrics = "0.24.6"
rosu-v2 = { version = "0.11.0", features = ["serialize"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sqlx = { version = "0.9.0", features = [
    "runtime-tokio",
    "postgres",
    "derive",
    "bigdecimal",
    "chrono",
    "json",
    "migrate",
] }
tracing = "0.1"
