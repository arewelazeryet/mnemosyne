[workspace]
members = ["mnemosyne", "mnemosyne-cache", "mnemosyne-macros"]
resolver = "3"

[workspace.dependencies]
pastey = "0.2.3"
redis = { version = "1.4", features = ["json", "connection-manager", "tokio-comp"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
futures = "0.3.32"
